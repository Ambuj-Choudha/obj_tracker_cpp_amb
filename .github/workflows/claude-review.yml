name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the action can diff against the base branch

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Review this pull request in full.

            Scope: the complete diff of the PR branch against its base, which is
            `git diff ${{ github.event.pull_request.base.sha }}...HEAD`. Run that
            command and review everything it returns — not just the most recent
            commit. On a re-run triggered by a new push, earlier commits in the PR
            are still in scope.

            It is a C++23 object-detection and tracking pipeline built on OpenCV,
            onnxruntime and Eigen, with ByteTrack vendored under src/ByteTrack.

            Report only:
              - correctness bugs, with a concrete failing input or state
              - lifetime, ownership and aliasing mistakes around cv::Mat and Ort:: types
              - reuse or simplification opportunities in the changed code

            Do not review src/ByteTrack — it is third-party.
            Do not comment on formatting, and do not restate what the diff does.
            If nothing meets the bar above, say so instead of padding the review.
          claude_args: |
            --max-turns 10
            --allowedTools "Bash(git diff:*) Bash(git log:*) Bash(git merge-base:*)"
